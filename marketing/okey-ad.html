<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;font-family:Cairo,sans-serif;color:#fff;overflow:hidden;
background:radial-gradient(ellipse at 50% 30%,#1f7a55 0%,#0f4d36 55%,#082a1e 100%)}
.wrap{position:relative;height:100%;padding:70px 80px 60px;display:flex;flex-direction:column;align-items:center}
.tiles{display:flex;gap:22px;margin-bottom:26px;direction:ltr}
.tile{width:96px;height:132px;background:linear-gradient(#fffdf6,#efe6cf);border-radius:14px;
box-shadow:0 10px 0 #c9bd9c,0 18px 30px rgba(0,0,0,.45);transform:rotate(var(--r));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile span{font:900 60px/1 Cairo;color:var(--c)}
.tile i{width:22px;height:22px;border-radius:50%;background:var(--c)}
h1{font-weight:900;font-size:118px;line-height:1.05;letter-spacing:-1px;text-shadow:0 6px 0 rgba(0,0,0,.25)}
h1 b{color:#ffd54f}
.sub{font-size:40px;font-weight:700;color:#c8f0dc;margin-top:6px}
.bubble{margin-top:30px;background:#ffd54f;color:#3b2400;font-weight:900;font-size:44px;padding:14px 40px;border-radius:40px;position:relative;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.bubble:after{content:"";position:absolute;bottom:-22px;right:90px;border:14px solid transparent;border-top:22px solid #ffd54f}
.feat{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;font-size:32px;font-weight:700;width:100%}
.feat div{display:flex;align-items:center;gap:14px}
.feat em{font-style:normal;width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:32px;flex:none}
.qrbox{margin-top:auto;display:flex;align-items:center;gap:44px;background:#fff;color:#0b2e22;border-radius:36px;padding:30px 40px 30px 30px;box-shadow:0 24px 50px rgba(0,0,0,.45)}
.qr{width:400px;height:400px;flex:none}
.cta{display:flex;flex-direction:column;gap:12px;max-width:380px}
.cta strong{font-size:58px;font-weight:900;line-height:1.1}
.cta span{font-size:30px;font-weight:700;color:#2e6b52}
.cta small{font-size:24px;color:#5d7f70;font-weight:500}
</style></head><body><div class="wrap">
